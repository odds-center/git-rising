name: release
# Push a tag like v0.2.1 → builds macOS (arm64/x64) + Windows and attaches them to a GitHub Release.
# Installed apps check this release feed and update themselves.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  # Keep only the newest 3 releases (each one carries ~600 MB of installers).
  # Installed apps only ever look at the latest release, so older ones are not needed. Tags are kept.
  prune:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases older than the newest 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            echo "deleting release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
