<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gittree</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="tabs">
    <div id="tab-list"></div>
    <button id="tab-add" class="icon-btn" title="저장소 열기">+</button>
  </header>

  <div id="toolbar">
    <div class="tb-group">
      <div class="tb-label">repository</div>
      <button id="tb-repo" class="tb-select"><span id="tb-repo-name">—</span> <span class="caret">▾</span></button>
    </div>
    <div class="tb-sep">›</div>
    <div class="tb-group">
      <div class="tb-label">branch</div>
      <button id="tb-branch" class="tb-select"><span id="tb-branch-name">—</span> <span class="caret">▾</span></button>
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" data-act="fetch"><i>⟳</i><span>Fetch</span></button>
    <button class="tb-btn" data-act="pull"><i>⤓</i><span>Pull</span></button>
    <button class="tb-btn" data-act="push"><i>⤒</i><span>Push</span></button>
    <button class="tb-btn" data-act="newbranch"><i>⑂</i><span>Branch</span></button>
    <button class="tb-btn" data-act="stash"><i>⊻</i><span>Stash</span></button>
    <button class="tb-btn" data-act="pop"><i>⊼</i><span>Pop</span></button>
    <div class="tb-vsep"></div>
    <button class="tb-btn" data-act="terminal"><i>&gt;_</i><span>Terminal</span></button>
    <button class="tb-btn" data-act="reveal"><i>▤</i><span>Finder</span></button>
    <div class="tb-vsep"></div>
    <div id="search-wrap">
      <input id="search" placeholder="커밋 검색 (⌘F)" spellcheck="false">
      <span id="search-count"></span>
    </div>
  </div>

  <div id="banner" hidden></div>

  <main id="main">
    <aside id="sidebar">
      <div id="sb-head">
        <div id="sb-viewing">Viewing <b id="sb-count">0</b></div>
        <input id="sb-filter" placeholder="Filter (⌘⌥F)" spellcheck="false">
      </div>
      <div id="sb-body"></div>
    </aside>
    <div class="resizer" data-target="sidebar"></div>

    <section id="center">
      <div id="graph-header">
        <div class="c-ref">BRANCH / TAG</div>
        <div class="c-graph">GRAPH</div>
        <div class="c-msg">COMMIT MESSAGE</div>
        <div class="c-author">AUTHOR</div>
        <div class="c-date">DATE</div>
        <div class="c-sha">SHA</div>
      </div>
      <div id="graph-scroll" tabindex="0">
        <div id="graph-inner">
          <canvas id="graph-canvas"></canvas>
          <div id="rows"></div>
        </div>
      </div>
      <div id="diff-view" hidden>
        <div id="diff-head">
          <button id="diff-close" class="icon-btn" title="닫기 (Esc)">✕</button>
          <span id="diff-title"></span>
          <span class="tb-spacer"></span>
          <label class="chk"><input type="checkbox" id="diff-wrap"> wrap</label>
        </div>
        <div id="diff-body"></div>
      </div>
      <div id="empty" hidden></div>
    </section>

    <div class="resizer" data-target="detail"></div>
    <aside id="detail"><div class="placeholder">커밋을 선택하세요</div></aside>
  </main>
</div>

<div id="menu-layer"></div>
<div id="modal-layer" hidden></div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
