<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Rising</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="tab-list"></div>
    <button id="tab-add" class="ib" title="저장소 열기 (⌘O)"></button>
    <div class="grow drag"></div>
    <button id="cmdk" title="명령 팔레트"><i data-i="search"></i><span>검색 · 명령</span><kbd>⌘K</kbd></button>
  </header>

  <div id="toolbar">
    <nav id="actions">
      <div class="grp">
        <button class="tb" data-act="fetch" data-tip="원격의 최신 정보를 받아옵니다 (내 브랜치는 그대로)|git fetch --prune"><i data-i="refresh"></i><span>가져오기</span></button>
        <button class="tb" data-act="pull" data-tip="원격의 변경을 현재 브랜치에 합칩니다|git pull"><i data-i="down"></i><span>풀</span><b class="cnt" id="cnt-pull" hidden></b></button>
        <button class="tb caret" data-menu="pull" data-tip="풀 방식 고르기"><i data-i="chev-down"></i></button>
        <button class="tb" data-act="push" data-tip="현재 브랜치 커밋을 원격에 올립니다 (처음이면 -u origin)|git push"><i data-i="up"></i><span>푸시</span><b class="cnt" id="cnt-push" hidden></b></button>
        <button class="tb caret" data-menu="push" data-tip="강제 푸시 · 태그 푸시"><i data-i="chev-down"></i></button>
      </div>
      <div class="grp">
        <button class="tb" data-act="newbranch" data-tip="현재 위치에서 새 브랜치|git checkout -b"><i data-i="branch-plus"></i><span>브랜치</span></button>
        <button class="tb" data-act="stash" data-tip="커밋 안 한 변경을 임시 보관|git stash push -u"><i data-i="archive"></i><span>스태시</span></button>
        <button class="tb" data-act="pop" data-tip="가장 최근 스태시를 다시 꺼내기|git stash pop"><i data-i="unarchive"></i><span>꺼내기</span><b class="cnt" id="cnt-stash" hidden></b></button>
        <button class="tb caret" data-menu="stash" data-tip="스태시 목록 — 골라서 적용 · 삭제"><i data-i="chev-down"></i></button>
      </div>
      <div class="grp">
        <button class="tb" data-act="undo" data-tip="방금 한 작업 되돌리기 (⌘Z)"><i data-i="undo"></i><span>되돌리기</span></button>
        <button class="tb" data-act="sync" data-tip="현재 브랜치를 원격과 완전히 똑같이|git fetch && git reset --hard @{u}"><i data-i="cloud-down"></i><span>원격과 맞추기</span></button>
      </div>
      <div class="grp">
        <button class="tb icon-only" data-act="head" data-tip="현재 체크아웃 위치로 이동 (Shift+H)"><i data-i="checkout"></i></button>
        <button class="tb icon-only" data-act="find" data-tip="커밋 검색 — 전체 히스토리 (⌘F)"><i data-i="search"></i></button>
        <button class="tb icon-only" data-act="remotes" data-tip="원격 브랜치 표시 / 숨기기"><i data-i="cloud"></i></button>
        <button class="tb icon-only" data-act="reload" data-tip="새로고침 (⌘R)"><i data-i="rotate"></i></button>
      </div>
      <div class="grp">
        <button class="tb icon-only" data-act="terminal" data-tip="내장 터미널 열기/닫기 (⌃`)|기본 셸 · 이 저장소 폴더에서 시작"><i data-i="terminal"></i></button>
        <button class="tb icon-only" data-act="reveal" data-tip="Finder / 탐색기로 열기"><i data-i="folder"></i></button>
        <button class="tb icon-only" data-act="web" data-tip="GitHub 에서 저장소 열기"><i data-i="external"></i></button>
        <button class="tb" data-act="pr" data-tip="현재 브랜치로 Pull Request 만들기 (웹)"><i data-i="merge"></i><span>PR</span></button>
      </div>
    </nav>
    <span class="grow"></span>
    <span id="tb-status"></span>
  </div>

  <div id="banner" hidden></div>

  <main id="main">
    <aside id="sidebar">
      <button id="sb-repo" title="저장소 바꾸기 (⌘O)">
        <span class="repo-ic"></span>
        <span class="repo-tx"><b id="sb-repo-name">—</b><small id="sb-repo-path"></small></span>
        <i data-i="chevrons"></i>
      </button>
      <button id="sb-branch" title="브랜치 전환 / 원격과 맞추기"></button>
      <div class="sb-filter"><i data-i="filter"></i><input id="sb-filter" placeholder="브랜치 필터  ⌘⌥F" spellcheck="false"></div>
      <div id="sb-body"></div>
    </aside>
    <div class="resizer" data-target="sidebar"></div>

    <section id="center">
      <div id="graph-header" title="경계를 드래그해서 너비 조절 · 더블클릭하면 기본값">
        <div>브랜치 / 태그<span class="col-rz" data-b="0"></span></div>
        <div>그래프<span class="col-rz" data-b="1"></span></div>
        <div>커밋 메시지<span class="col-rz" data-b="2"></span></div>
        <div>작성자<span class="col-rz" data-b="3"></span></div>
        <div>날짜<span class="col-rz" data-b="4"></span></div>
        <div>SHA</div>
      </div>
      <div id="graph-scroll" tabindex="0">
        <div id="graph-inner"><div id="rows"></div></div>
      </div>
      <canvas id="graph-canvas"></canvas>
      <div id="findbar" hidden>
        <i data-i="search"></i>
        <input id="find" placeholder="메시지 · 작성자 · SHA (전체 히스토리)" spellcheck="false">
        <span id="find-count"></span>
        <button class="ib" id="find-prev" title="이전 (Shift+Enter)"><i data-i="chev-up"></i></button>
        <button class="ib" id="find-next" title="다음 (Enter)"><i data-i="chev-down"></i></button>
        <button class="ib" id="find-close" title="닫기 (Esc)"><i data-i="x"></i></button>
      </div>
      <div id="diff-view" hidden>
        <div id="diff-head">
          <button id="diff-close" class="ib" title="닫기 (Esc)"><i data-i="x"></i></button>
          <span id="diff-title"></span>
          <span class="grow"></span>
          <label class="chk"><input type="checkbox" id="diff-wrap"> 줄바꿈</label>
        </div>
        <div id="diff-body"></div>
      </div>
      <div id="empty" hidden></div>
      <div id="term-panel" hidden>
        <div class="term-rz" title="드래그해서 높이 조절"></div>
        <div id="term-head"><div id="term-tabs" style="display:flex;gap:2px;overflow:auto"></div>
          <button class="ib" id="term-add" title="새 터미널"><i data-i="plus"></i></button>
          <span class="grow"></span>
          <button class="ib" id="term-ext" title="외부 터미널 앱으로 열기"><i data-i="external"></i></button>
          <button class="ib" id="term-hide" title="숨기기 (⌃`)"><i data-i="chev-down"></i></button>
        </div>
        <div id="term-body"></div>
      </div>
    </section>

    <div class="resizer" data-target="detail"></div>
    <aside id="detail"></aside>
  </main>

  <footer id="statusbar">
    <span id="sb-live" title="저장소 변경을 실시간으로 감시합니다. 창이 백그라운드면 멈춰서 CPU 를 쓰지 않아요."><span class="dot"></span><span id="sb-live-tx">대기</span></span>
    <span id="sb-path" class="muted"></span>
    <span class="grow"></span>
    <span id="sb-loading" class="muted"></span>
    <span id="sb-count" class="muted"></span>
    <button id="sb-ai" hidden title="AI 사용량 — 눌러서 자세히"></button>
    <button id="sb-update" hidden></button>
    <button id="sb-theme" class="ib" title="테마 전환"></button>
    <button id="sb-settings" class="ib" title="설정 (SSH · 저장소 찾기 · 업데이트)"><i data-i="settings"></i></button>
  </footer>
</div>

<div id="tip" hidden></div>
<div id="menu-layer"></div>
<div id="palette-layer" hidden><div id="palette"><div class="pl-in"><i data-i="search"></i><input id="pl-input" spellcheck="false"></div><div id="pl-list"></div><div id="pl-foot"></div></div></div>
<div id="modal-layer" hidden></div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
